<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a16" />
      <stop offset="100%" stop-color="#14051d" />
    </linearGradient>
    <radialGradient id="mesh1" cx="30%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="mesh2" cx="75%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="mesh3" cx="60%" cy="80%" r="65%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="mesh4" cx="20%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" />

  <!-- Fluid Mesh Nodes -->
  <g filter="url(#glow)">
    <circle cx="35" cy="35" r="32" fill="url(#mesh1)" />
    <circle cx="70" cy="38" r="28" fill="url(#mesh2)" />
    <circle cx="58" cy="72" r="30" fill="url(#mesh3)" />
    <circle cx="28" cy="68" r="26" fill="url(#mesh4)" />
  </g>

  <!-- Center Lumina Core Prism Spark -->
  <circle cx="50" cy="50" r="14" fill="#ffffff" opacity="0.85" filter="url(#glow)" />
  <circle cx="50" cy="50" r="7" fill="#ffffff" />
</svg>
